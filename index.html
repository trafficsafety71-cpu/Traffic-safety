<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>قسم السلامة المرورية</title>

<script>
(function(){
  try {
    if (localStorage.getItem('trafficSafetyTheme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch(e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#121815;
    --surface:#182420;
    --surface-2:#1E2C27;
    --text:#E7EFEC;
    --text-dim:#94A8A0;
    --border:#33473F;
    --primary:#3FA98A;
    --primary-2:#2F8870;
    --amber:#E0A959;
    --amber-2:#C98A3B;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
    --shadow-lg: 0 4px 10px rgba(0,0,0,.35), 0 20px 40px -16px rgba(0,0,0,.6);
  }
  /* الوضع الافتراضي داكن؛ زر التبديل أعلى الصفحة يحوّل لوضع نهاري ثابت،
     بغض النظر عن إعداد الجهاز نفسه. */
  :root[data-theme="light"]{
    color-scheme: light;
    --bg: #EFEEE9;
    --surface: #FFFFFF;
    --surface-2: #F3F7F6;
    --text: #182420;
    --text-dim: #5B6D66;
    --border: #D8E3DF;
    --primary: #1E6F5C;
    --primary-2: #155A49;
    --amber: #C98A3B;
    --amber-2: #AD7530;
    --shadow: 0 1px 2px rgba(20,30,45,.06), 0 8px 24px -12px rgba(20,30,45,.12);
    --shadow-lg: 0 4px 10px rgba(20,30,45,.08), 0 20px 40px -16px rgba(20,30,45,.18);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;padding:0;width:100%;max-width:100vw;overflow-x:hidden;
    background: var(--bg);
    color: var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100%;
  }
  h1,h2,.eyebrow{font-family:'Cairo', sans-serif;}

  .page{
    direction:rtl;
    position:relative;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:0;
    padding:calc(48px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px));
    text-align:center;
  }

  .theme-toggle{
    position:absolute;
    top:calc(16px + env(safe-area-inset-top,0px));
    left:16px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    color:var(--text);
    transition:border-color .16s ease, transform .16s ease;
  }
  .theme-toggle:hover{border-color:var(--primary); transform:translateY(-1px);}
  .theme-toggle svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .theme-toggle .icon-sun{display:none;}
  .theme-toggle .icon-moon{display:block;}
  :root[data-theme="light"] .theme-toggle .icon-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .icon-moon{display:none;}

  .crest{
    width:min(132px, 30vw);
    height:auto;
    display:block;
    margin-bottom:18px;
    filter:drop-shadow(0 6px 14px rgba(20,30,45,.16));
  }

  .eyebrow{
    font-size:13px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--primary);
    background:color-mix(in srgb, var(--primary) 10%, transparent);
    border:1px solid color-mix(in srgb, var(--primary) 24%, transparent);
    padding:6px 16px;
    border-radius:20px;
    margin-bottom:16px;
  }

  h1{
    font-size:clamp(28px, 5.2vw, 44px);
    font-weight:900;
    margin:0 0 10px;
    color:var(--text);
    text-wrap:balance;
  }

  .sub{
    color:var(--text-dim);
    font-size:15.5px;
    max-width:480px;
    margin:0 0 40px;
    line-height:1.7;
  }

  .links{
    width:100%;
    max-width:640px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media (max-width:560px){
    .links{grid-template-columns:1fr;}
  }

  .link-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--text);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:30px 22px 26px;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .link-card:hover, .link-card:focus-visible{
    transform:translateY(-4px);
    box-shadow:var(--shadow-lg);
    border-color:var(--primary);
    outline:none;
  }
  .link-card .icon-wrap{
    width:58px;height:58px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .link-card.card-a .icon-wrap{background:color-mix(in srgb, var(--primary) 14%, var(--surface));}
  .link-card.card-b .icon-wrap{background:color-mix(in srgb, var(--amber) 16%, var(--surface));}
  .link-card svg{width:28px;height:28px;}
  .link-card.card-a svg{stroke:var(--primary);}
  .link-card.card-b svg{stroke:var(--amber-2);}
  .link-card .card-title{
    font-family:'Cairo', sans-serif;
    font-size:17px;
    font-weight:800;
  }
  .link-card .card-desc{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .link-card .go{
    margin-top:10px;
    width:100%;
    box-sizing:border-box;
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:12px 16px;
    border-radius:10px;
    color:#fff;
    transition:background .16s ease, transform .16s ease;
  }
  .link-card.card-a .go{background:var(--primary);}
  .link-card.card-b .go{background:var(--amber-2);}
  .link-card.card-a:hover .go{background:var(--primary-2);}
  .link-card.card-b:hover .go{background:var(--amber-2); filter:brightness(.92);}
  .link-card .go svg{width:15px;height:15px;stroke-width:2.6;stroke:#fff;}

  footer{
    margin-top:44px;
    font-size:12px;
    color:var(--text-dim);
  }
</style>
</head>
